$kind: http-request
name: Create recovery case
order: 6000
method: POST
url: '{{baseUrl}}/collections/outstanding/{{outstandingSaleId}}/recovery-case'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "note": "Postman Phase 6 recovery follow-up"
    }
description: Mutates cases. Run List outstanding first.
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('has caseNo', () => pm.expect(j.caseNo).to.be.a('string'));
