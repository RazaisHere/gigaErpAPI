$kind: http-request
name: List upcoming dues
order: 3000
method: GET
url: '{{baseUrl}}/collections/upcoming-dues?withinDays=90&pageSize=10'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('has data', () => pm.expect(j.data).to.be.an('array'));
