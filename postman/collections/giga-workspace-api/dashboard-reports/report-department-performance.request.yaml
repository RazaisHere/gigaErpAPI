$kind: http-request
name: Report — department performance
order: 3000
method: GET
url: '{{baseUrl}}/reports/department-performance'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('data array', () => pm.expect(j.data).to.be.an('array'));
