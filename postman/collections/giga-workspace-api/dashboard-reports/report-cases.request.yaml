$kind: http-request
name: Report — cases
order: 2000
method: GET
url: '{{baseUrl}}/reports/cases'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('breakdowns present', () => {
        pm.expect(j.byStatus).to.be.an('array');
        pm.expect(j.byPriority).to.be.an('array');
        pm.expect(j.bySlaBand).to.be.an('array');
        pm.expect(j.byDepartment).to.be.an('array');
      });
