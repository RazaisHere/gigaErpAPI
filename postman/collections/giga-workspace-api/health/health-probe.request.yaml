$kind: http-request
name: Health probe (src_projects)
order: 2000
method: GET
url: '{{baseUrl}}/health/probe'
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('src_projects count is 4', () => {
        const j = pm.response.json();
        pm.expect(j.count).to.eql(4);
        pm.expect(j.ok).to.be.true;
      });
