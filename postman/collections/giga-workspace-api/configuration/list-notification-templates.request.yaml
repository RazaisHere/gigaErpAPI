$kind: http-request
name: List notification templates
order: 4000
method: GET
url: '{{baseUrl}}/notification-templates'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('array', () => pm.expect(j).to.be.an('array'));
      if (j[0]) pm.collectionVariables.set('templateId', String(j[0].id));
