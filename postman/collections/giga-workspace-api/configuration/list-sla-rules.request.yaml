$kind: http-request
name: List SLA rules
order: 3000
method: GET
url: '{{baseUrl}}/sla-rules'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('array', () => pm.expect(j).to.be.an('array'));
