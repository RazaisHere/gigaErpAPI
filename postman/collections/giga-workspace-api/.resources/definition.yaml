  also refresh postman/Giga Workspace API.postman_collection.json.
variables:
  - key: baseUrl
    value: 'http://localhost:3001/api/v1'
  - key: accessToken
    value: ''
  - key: hamzaToken
    value: ''
  - key: clientToken
    value: ''
