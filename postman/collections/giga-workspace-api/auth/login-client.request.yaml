$kind: http-request
name: Login — Client
order: 3000
method: POST
url: '{{baseUrl}}/auth/login'
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{clientEmail}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('client role', () => pm.expect(j.user.role.code).to.eql('client'));
      if (j.accessToken) {
        pm.collectionVariables.set('clientToken', j.accessToken);
      }
