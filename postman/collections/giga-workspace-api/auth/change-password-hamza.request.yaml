$kind: http-request
name: Change password — Hamza
order: 6000
method: POST
url: '{{baseUrl}}/auth/change-password'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{hamzaToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{password}}",
      "newPassword": "TempPhase1@999"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      if (j.accessToken) {
        pm.collectionVariables.set('hamzaToken', j.accessToken);
      }
