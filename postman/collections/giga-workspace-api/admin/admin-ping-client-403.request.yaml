$kind: http-request
name: 'Admin ping — Client (expect 403)'
order: 2000
method: GET
url: '{{baseUrl}}/admin/ping'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{clientToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 403', () => pm.response.to.have.status(403));
