$kind: http-request
name: List members — Ayesha own dept
order: 2000
method: GET
url: '{{baseUrl}}/members'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{ayeshaToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const rows = pm.response.json();
      pm.test('only CCS', () => rows.forEach(r => pm.expect(r.department.code).to.eql('CCS')));
