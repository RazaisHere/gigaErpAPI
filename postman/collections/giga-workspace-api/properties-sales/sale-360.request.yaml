$kind: http-request
name: Sale 360
order: 3000
method: GET
url: '{{baseUrl}}/sales/{{saleId}}'
description: |-
  Sale detail — owners, unit/project, installments, receipts, surcharges, related cases.
  Run List sales first to set {{saleId}}.
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('has owners', () => pm.expect(j.owners).to.be.an('array'));
      pm.test('has installments', () => pm.expect(j.installments).to.be.an('array'));
