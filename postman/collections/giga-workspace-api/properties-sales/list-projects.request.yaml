$kind: http-request
name: List projects
order: 5000
method: GET
url: '{{baseUrl}}/projects'
description: Phase 5 — projects with building/unit/sold counts (4 demo projects).
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('four demo projects', () => pm.expect(j.data.length).to.eql(4));
      if (j.data && j.data[0]) pm.collectionVariables.set('projectId', String(j.data[0].id));
