$kind: http-request
name: Project detail
order: 6000
method: GET
url: '{{baseUrl}}/projects/{{projectId}}'
description: Project + buildings. Run List projects first to set {{projectId}}.
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('has buildings', () => pm.expect(j.buildings).to.be.an('array'));
