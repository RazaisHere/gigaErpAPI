$kind: http-request
name: List inventory
order: 4000
method: GET
url: '{{baseUrl}}/inventory?page=1&pageSize=10'
description: Phase 5 — units with Available/Sold status.
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('has data', () => pm.expect(j.data).to.be.an('array'));
