$kind: http-request
name: 'Illegal transition (expect 422)'
order: 3000
method: PATCH
url: '{{baseUrl}}/cases/{{caseId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "Resolved"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 422', () => pm.response.to.have.status(422));
